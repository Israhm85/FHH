<style>
/* ── Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  font-family: Arial, sans-serif;
  --accent: #1a3a6e;
  --border: #ccc;
  --error-color: #c0392b;
}

body {
  margin: 0;
  padding: 20px;
  background: #f0f2f5;
  color: #222;
}

/* ── App wrapper ─────────────────────────────────────────────────── */
.app {
  max-width: 960px;
  margin: 0 auto;
}

.app-title {
  text-align: center;
  color: var(--accent);
  margin-bottom: 24px;
}

/* ── Form ────────────────────────────────────────────────────────── */
.form-grid {
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field label {
  font-size: 13px;
  font-weight: bold;
  color: #444;
}

.field input,
.field select {
  padding: 9px 10px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition: border-color .2s;
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
}

.field input.invalid,
.field select.invalid {
  border-color: var(--error-color);
}

.field-error-msg {
  font-size: 11px;
  color: var(--error-color);
  display: none;
}

.field input.invalid + .field-error-msg,
.field select.invalid + .field-error-msg {
  display: block;
}

/* Form actions span full width */
.form-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.form-actions button {
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background .2s, opacity .2s;
}

#btnGenerate {
  background: var(--accent);
  color: #fff;
}

#btnGenerate:hover {
  background: #25519a;
}

#btnPrint {
  background: #27ae60;
  color: #fff;
}

#btnPrint:hover:not(:disabled) {
  background: #219150;
}

#btnPrint:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* ── Print area ──────────────────────────────────────────────────── */
#printArea {
  margin-top: 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  justify-content: center;
}

/* ── Placard card ────────────────────────────────────────────────── */
.placard {
  background: #fff;
  border: 3px solid #000;
  border-radius: 0;
  padding: 20px 24px 16px;
  width: 520px;
  display: flex;
  flex-direction: column;
  gap: 0;
  break-inside: avoid;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

/* Unique I'D — blank line only, fill with marker */
.placard-uid-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 10px;
}

.uid-label {
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
}

.uid-blank {
  flex: 1;
  border-bottom: 2px solid #000;
  height: 24px;
}

/* PALLT# */
.placard-pallt {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 3px;
}

/* Trader Joe's + size sub-label */
.placard-tj-sub {
  font-size: 11px;
  margin-bottom: 12px;
}

/* Large product name — dominant visual element */
.placard-product-name {
  font-size: 56px;
  font-weight: 900;
  text-align: center;
  text-transform: uppercase;
  line-height: 1.1;
  letter-spacing: 1px;
  margin: 0 0 14px;
}

/* Large blank area for write-in number with marker */
.placard-number-blank {
  height: 72px;
  border-bottom: 2px solid #000;
  margin-bottom: 16px;
}

/* CODE + CS row */
.placard-code-cs {
  display: flex;
  gap: 28px;
  font-size: 13px;
  margin-bottom: 5px;
}

.code-item strong {
  font-size: 13px;
}

.cs-item {
  font-size: 13px;
}

/* PO line */
.placard-po {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 4px;
}

/* Keep Refrigerated */
.placard-keep-refrig {
  font-size: 9px;
  font-style: italic;
  text-align: right;
}

/* ── Generation error ────────────────────────────────────────────── */
.gen-error {
  color: var(--error-color);
  font-weight: bold;
  text-align: center;
  padding: 12px;
  background: #fdecea;
  border: 1px solid var(--error-color);
  border-radius: 6px;
}

/* ── Print media ─────────────────────────────────────────────────── */
@media print {
  body {
    background: #fff;
    padding: 0;
  }

  .app-title,
  .form-grid {
    display: none !important;
  }

  #printArea {
    margin: 0;
    gap: 0;
    display: block;
  }

  .placard {
    box-shadow: none;
    border: 3px solid #000;
    border-radius: 0;
    width: 100%;
    min-height: calc(100vh - 20mm);
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 28px 36px 20px;
  }

  .placard-product-name {
    font-size: 80px;
  }

  .placard-number-blank {
    height: 100px;
  }

  .placard + .placard {
    page-break-before: always;
    break-before: page;
  }
}
</style>
