<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  font-family: "Manrope", Arial, sans-serif;
  --accent: #2b7a4b;
  --accent-dark: #1f5e39;
  --accent-soft: #edf8ef;
  --lime: #b8df52;
  --mint: #5fcf8b;
  --carrot: #ff8b42;
  --ink: #173126;
  --ink-soft: #5b6d62;
  --border: rgba(43, 122, 75, 0.18);
  --panel-border: rgba(255,255,255,0.55);
  --error-color: #c0392b;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(circle at top left, rgba(184, 223, 82, 0.28), transparent 24%),
    radial-gradient(circle at top right, rgba(95, 207, 139, 0.2), transparent 28%),
    linear-gradient(135deg, #f4fbf3 0%, #eef8f0 38%, #fff8ef 100%);
  color: var(--ink);
  position: relative;
  overflow-x: hidden;
}

.page-decor {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.decor-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0.7;
  animation: floatOrb 16s ease-in-out infinite;
}

.decor-orb::after {
  content: "";
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  background: rgba(255,255,255,0.28);
}

.decor-orb--lime {
  width: 240px;
  height: 240px;
  top: 70px;
  left: -40px;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(184, 223, 82, 0.92) 55%, rgba(116, 159, 44, 0.88) 100%);
}

.decor-orb--carrot {
  width: 150px;
  height: 150px;
  top: 140px;
  right: 10%;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.58), rgba(255, 139, 66, 0.9) 58%, rgba(224, 103, 34, 0.9) 100%);
  animation-duration: 18s;
}

.decor-orb--leaf {
  width: 320px;
  height: 320px;
  right: -80px;
  bottom: 60px;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), rgba(95, 207, 139, 0.78) 54%, rgba(43, 122, 75, 0.82) 100%);
  animation-duration: 20s;
}

.decor-orb--mint {
  width: 120px;
  height: 120px;
  left: 14%;
  bottom: 120px;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(95, 207, 139, 0.82) 56%, rgba(43, 122, 75, 0.88) 100%);
  animation-duration: 14s;
}

@keyframes floatOrb {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(0, -20px, 0) scale(1.04); }
}

/* ── App wrapper ─────────────────────────────────────────────────── */
.app {
  position: relative;
  z-index: 1;
  max-width: 1120px;
  margin: 0 auto;
}

.app-shell {
  position: relative;
  padding: clamp(24px, 4vw, 40px);
  border-radius: 32px;
  background: rgba(255,255,255,0.72);
  border: 1px solid var(--panel-border);
  box-shadow: 0 24px 70px rgba(22, 48, 35, 0.12);
  backdrop-filter: blur(12px);
  overflow: hidden;
}

.app-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, rgba(184, 223, 82, 0.14), transparent 35%),
    linear-gradient(315deg, rgba(255, 139, 66, 0.08), transparent 28%);
  pointer-events: none;
}

.app-header,
.section-panel {
  position: relative;
  z-index: 1;
}

.app-header {
  padding: 4px 0 28px;
  text-align: center;
}

.brand-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(255,255,255,0.82);
  border: 1px solid rgba(43, 122, 75, 0.14);
  box-shadow: 0 10px 24px rgba(43, 122, 75, 0.08);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.app-title {
  margin: 18px 0 12px;
  font-family: "Manrope", Arial, sans-serif;
  font-size: clamp(2rem, 4vw, 3.4rem);
  line-height: 1.02;
  color: var(--ink);
}

.app-subtitle {
  max-width: 700px;
  margin: 0 auto;
  color: var(--ink-soft);
  font-size: 1rem;
  line-height: 1.7;
}

/* ── Form ────────────────────────────────────────────────────────── */
.section-panel {
  margin-top: 18px;
}

.form-grid {
  background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(247, 252, 247, 0.96));
  padding: 28px;
  border-radius: 24px;
  border: 1px solid rgba(43, 122, 75, 0.12);
  box-shadow: 0 18px 45px rgba(24, 52, 37, 0.08);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.field input,
.field select {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fbfef8;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  outline: none;
  box-shadow: inset 0 1px 2px rgba(21, 46, 33, 0.04);
  transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
}

.field input:focus,
.field select:focus {
  border-color: rgba(43, 122, 75, 0.5);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(184, 223, 82, 0.24);
  transform: translateY(-1px);
}

.field input.invalid,
.field select.invalid {
  border-color: var(--error-color);
  background: #fffaf9;
}

.field-error-msg {
  font-size: 11px;
  color: var(--error-color);
  display: none;
}

.field input.invalid + .field-error-msg,
.field select.invalid + .field-error-msg {
  display: block;
}

/* Form actions span full width */
.form-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  padding-top: 4px;
}

.form-actions button {
  min-width: 180px;
  padding: 14px 24px;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 14px 24px rgba(22, 48, 35, 0.14);
  transition: transform .2s, box-shadow .2s, opacity .2s, filter .2s;
}

#btnGenerate,
#ch-btnGenerate {
  background: linear-gradient(135deg, var(--accent) 0%, var(--mint) 100%);
  color: #fff;
}

#btnGenerate:hover,
#ch-btnGenerate:hover {
  filter: brightness(1.02);
}

#btnPrint,
#ch-btnPrint {
  background: rgba(255,255,255,0.95);
  color: var(--accent-dark);
  border: 1px solid rgba(43, 122, 75, 0.14);
}

.form-actions button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 18px 28px rgba(22, 48, 35, 0.16);
}

.form-actions button:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}

/* ── Print area ──────────────────────────────────────────────────── */
#printArea {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

/* ── Placard card ────────────────────────────────────────────────── */
.placard {
  background: linear-gradient(180deg, #fff 0%, #fcfffb 100%);
  border: 1px solid rgba(23, 49, 38, 0.1);
  border-radius: 26px;
  padding: 18px 28px 14px;
  width: 680px;
  display: flex;
  flex-direction: column;
  gap: 0;
  break-inside: avoid;
  box-shadow: 0 18px 40px rgba(14, 37, 25, 0.12);
  font-family: Calibri, 'Carlito', sans-serif;
}

/* Unique ID — left label + full-width underline */
.placard-uid-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 14px;
}

.uid-label {
  font-size: 65px;
  white-space: nowrap;
}

.uid-blank {
  flex: 1;
  border-bottom: 2px solid #000;
  height: 30px;
}

/* PALLET# — large, bold, centered */
.placard-pallet {
  font-size: 90px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 2px;
}

.pallet-label {
  font-size: 0.8em;
}

.pallet-numbers {
  font-size: 1.1em;
}

/* TRADER JOES size — small, centered */
.placard-tj-sub {
  font-size: 30px;
  text-align: center;
  margin-bottom: 8px;
}

/* Product name — very large, bold, centered */
.placard-product-name {
  font-size: 58px;
  font-weight: 900;
  text-align: center;
  text-transform: uppercase;
  line-height: 1.1;
  margin: 0 0 16px;
}

/* Per-product sizes — maximized to fit 2 lines on the 624px content area */
.placard-product-name.name--edamame         { font-size: 82px; }   /* SHELLED / EDAMAME */
.placard-product-name.name--stuffed-peppers { font-size: 65px; }   /* STUFFED PEPPERS / WITH BEEF */
.placard-product-name.name--kung-pao        { font-size: 66px; }   /* KUNG PAO / BRUSSEL SPROUTS */
.placard-product-name.name--garlic          { font-size: 78px; }   /* GARLIC / ASIAGO DIP */
.placard-product-name.name--chicken         { font-size: 66px; }   /* CHICKEN STUFFED / POBLANO */
.placard-product-name.name--roasted         { font-size: 76px; }   /* ROASTED GREEN / VEGETABLES */

/* CODE — centered */
.placard-code {
  font-size: 30px;
  text-align: center;
  margin-bottom: 10px;
}

/* CS — centered */
.placard-cs {
  font-size: 30px;
  text-align: center;
  margin-bottom: 14px;
}

/* PO# left, destination right — large, bold */
.placard-po {
  font-size: 52px;
  font-weight: 900;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: baseline;
  line-height: 1;
  margin-bottom: 6px;
}

.placard-po > span {
  display: inline-block;
  transform: scale(1.1);
  transform-origin: bottom left;
}

.placard-po > span:last-child {
  transform-origin: bottom right;
}

/* Keep Refrigerated — small, centered */
.placard-keep-refrig {
  font-size: 14px;
  text-align: center;
}

/* ── Generation error ────────────────────────────────────────────── */
.gen-error {
  color: var(--error-color);
  font-weight: 700;
  text-align: center;
  padding: 16px 18px;
  background: #fff3ef;
  border: 1px solid rgba(192, 57, 43, 0.24);
  border-radius: 18px;
  box-shadow: 0 12px 24px rgba(192, 57, 43, 0.08);
}

@media (max-width: 760px) {
  body {
    padding: 14px;
  }

  .app-shell {
    padding: 18px;
    border-radius: 24px;
  }

  .form-grid {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .form-actions button {
    width: 100%;
  }

  .placard {
    width: 100%;
    padding-inline: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .decor-orb,
  .form-actions button,
  .field input,
  .field select {
    animation: none !important;
    transition: none !important;
  }
}

/* ── Print media ─────────────────────────────────────────────────── */
@page {
  size: landscape;
  margin: 10mm;
}

@media print {
  body {
    background: #fff;
    padding: 0;
  }

  .page-decor,
  .app-header,
  .client-selector,
  .app-title,
  .form-grid {
    display: none !important;
  }

  .app,
  .app-shell,
  .section-panel {
    max-width: none;
    padding: 0;
    margin: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    backdrop-filter: none;
  }

  #printArea {
    margin: 0;
    gap: 0;
    display: block;
  }

  .placard {
    box-shadow: none;
    border: 3px solid #000;
    width: 100%;
    height: 100vh;
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 20px 36px 20px;
    justify-content: space-between;
  }

  .placard-uid-row {
    margin-bottom: 0;
  }

  .uid-label {
    font-size: 65px;
  }

  .uid-blank {
    border-bottom: 2.5px solid #000;
    height: 38px;
  }

  .placard-pallet {
    font-size: 90px;
  }

  .pallet-label {
    font-size: 0.8em;
  }

  .pallet-numbers {
    font-size: 1.1em;
  }

  .placard-tj-sub {
    font-size: 30px;
    margin-bottom: 0;
  }

  .placard-product-name {
    font-size: 7.5vw;
    margin-bottom: 0;
  }

  /* Per-product print sizes — maximized to fit 2 lines on landscape page */
  .placard-product-name.name--edamame         { font-size: 10vw; }    /* SHELLED / EDAMAME */
  .placard-product-name.name--stuffed-peppers { font-size: 9vw; }     /* STUFFED PEPPERS / WITH BEEF */
  .placard-product-name.name--kung-pao        { font-size: 9vw; }     /* KUNG PAO / BRUSSEL SPROUTS */
  .placard-product-name.name--garlic          { font-size: 11vw; }    /* GARLIC / ASIAGO DIP */
  .placard-product-name.name--chicken         { font-size: 9vw; }     /* CHICKEN STUFFED / POBLANO */
  .placard-product-name.name--roasted         { font-size: 10.5vw; }  /* ROASTED GREEN / VEGETABLES */

  .placard-code,
  .placard-cs {
    font-size: 44px;
    margin-bottom: 0;
  }

  .placard-po {
    font-size: 80px;
    gap: 16px;
    margin-bottom: 0;
  }

  .placard-keep-refrig {
    font-size: 16px;
  }

  .placard + .placard {
    page-break-before: always;
    break-before: page;
  }
}
</style>
