<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* ── Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  font-family: Arial, sans-serif;
  --accent: #1a3a6e;
  --border: #ccc;
  --error-color: #c0392b;
}

body {
  margin: 0;
  padding: 20px;
  background: #f0f2f5;
  color: #222;
}

/* ── App wrapper ─────────────────────────────────────────────────── */
.app {
  max-width: 960px;
  margin: 0 auto;
}

.app-title {
  text-align: center;
  color: var(--accent);
  margin-bottom: 24px;
}

/* ── Form ────────────────────────────────────────────────────────── */
.form-grid {
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field label {
  font-size: 13px;
  font-weight: bold;
  color: #444;
}

.field input,
.field select {
  padding: 9px 10px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition: border-color .2s;
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
}

.field input.invalid,
.field select.invalid {
  border-color: var(--error-color);
}

.field-error-msg {
  font-size: 11px;
  color: var(--error-color);
  display: none;
}

.field input.invalid + .field-error-msg,
.field select.invalid + .field-error-msg {
  display: block;
}

/* Form actions span full width */
.form-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.form-actions button {
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background .2s, opacity .2s;
}

#btnGenerate {
  background: var(--accent);
  color: #fff;
}

#btnGenerate:hover {
  background: #25519a;
}

#btnPrint {
  background: #27ae60;
  color: #fff;
}

#btnPrint:hover:not(:disabled) {
  background: #219150;
}

#btnPrint:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* ── Print area ──────────────────────────────────────────────────── */
#printArea {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

/* ── Placard card ────────────────────────────────────────────────── */
.placard {
  background: #fff;
  border: 3px solid #000;
  padding: 18px 28px 14px;
  width: 680px;
  display: flex;
  flex-direction: column;
  gap: 0;
  break-inside: avoid;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  font-family: Calibri, 'Carlito', sans-serif;
}

/* Unique ID — left label + full-width underline */
.placard-uid-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 14px;
}

.uid-label {
  font-size: 34px;
  white-space: nowrap;
}

.uid-blank {
  flex: 1;
  border-bottom: 2px solid #000;
  height: 30px;
}

/* PALLET# — large, bold, centered */
.placard-pallet {
  font-size: 38px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 2px;
}

.pallet-label {
  font-size: 0.7em;
}

.pallet-numbers {
  font-size: 1.15em;
}

/* TRADER JOES size — small, centered */
.placard-tj-sub {
  font-size: 24px;
  text-align: center;
  margin-bottom: 8px;
}

/* Product name — very large, bold, centered, always single line */
.placard-product-name {
  font-size: 66px;
  font-weight: 900;
  text-align: center;
  text-transform: uppercase;
  line-height: 1.1;
  margin: 0 0 16px;
}

/* CODE — centered */
.placard-code {
  font-size: 30px;
  text-align: center;
  margin-bottom: 10px;
}

/* CS — centered */
.placard-cs {
  font-size: 30px;
  text-align: center;
  margin-bottom: 14px;
}

/* PO# left, destination right — large, bold */
.placard-po {
  font-size: 42px;
  font-weight: 900;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

/* Keep Refrigerated — small, centered */
.placard-keep-refrig {
  font-size: 14px;
  text-align: center;
}

/* ── Generation error ────────────────────────────────────────────── */
.gen-error {
  color: var(--error-color);
  font-weight: bold;
  text-align: center;
  padding: 12px;
  background: #fdecea;
  border: 1px solid var(--error-color);
  border-radius: 6px;
}

/* ── Print media ─────────────────────────────────────────────────── */
@page {
  size: landscape;
  margin: 10mm;
}

@media print {
  body {
    background: #fff;
    padding: 0;
  }

  .app-title,
  .form-grid {
    display: none !important;
  }

  #printArea {
    margin: 0;
    gap: 0;
    display: block;
  }

  .placard {
    box-shadow: none;
    border: 3px solid #000;
    width: 100%;
    height: 100vh;
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 20px 36px 20px;
    justify-content: space-between;
  }

  .placard-uid-row {
    margin-bottom: 0;
  }

  .uid-label {
    font-size: 44px;
  }

  .uid-blank {
    border-bottom: 2.5px solid #000;
    height: 38px;
  }

  .placard-pallet {
    font-size: 64px;
  }

  .pallet-label {
    font-size: 0.7em;
  }

  .pallet-numbers {
    font-size: 1.12em;
  }

  .placard-tj-sub {
    font-size: 30px;
    margin-bottom: 0;
  }

  .placard-product-name {
    font-size: 8.5vw;
    margin-bottom: 0;
  }

  .placard-code,
  .placard-cs {
    font-size: 44px;
    margin-bottom: 0;
  }

  .placard-po {
    font-size: 68px;
    margin-bottom: 0;
  }

  .placard-keep-refrig {
    font-size: 16px;
  }

  .placard + .placard {
    page-break-before: always;
    break-before: page;
  }
}
</style>
