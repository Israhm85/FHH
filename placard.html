  <script>
  (function () {
    var btnEC = document.getElementById('btnEastCoast');
    var btnCH = document.getElementById('btnChefHaks');
    var secEC = document.getElementById('sectionEastCoast');
    var secCH = document.getElementById('sectionChefHaks');
    var body = document.body;
    var brandPillText = document.getElementById('brandPillText');
    var appTitle = document.getElementById('appTitle');
    var appSubtitle = document.getElementById('appSubtitle');

    function setClientBrand(client) {
      if (client === 'chef-haks') {
        body.setAttribute('data-client', 'chef-haks');
        brandPillText.textContent = 'Fresh Healthy Habits';
        appTitle.textContent = "Creacion de ID's";
        appSubtitle.textContent = 'Para las reporteras de parte del 👷';
        return;
      }

      body.setAttribute('data-client', 'east-coast');
      brandPillText.textContent = 'Fresh Healthy Habits';
    appTitle.textContent = "Creacion de ID's";
    appSubtitle.textContent = 'Para las reporteras de parte del 👷';
    }

    btnEC.addEventListener('click', function () {
      secEC.style.display = '';
      secCH.style.display = 'none';
      btnEC.classList.add('active');
      btnCH.classList.remove('active');
      setClientBrand('east-coast');
    });

    btnCH.addEventListener('click', function () {
      secEC.style.display = 'none';
      secCH.style.display = '';
      btnCH.classList.add('active');
      btnEC.classList.remove('active');
      setClientBrand('chef-haks');
    });

    setClientBrand('east-coast');
  }());
  </script>
