<script>
(function () {
  var idsHeroField = document.getElementById('idsHeroField');
  var idsDetailsFields = document.getElementById('idsDetailsFields');
  var idsPrintArea = document.getElementById('idsPrintArea');
  var idsForm = document.getElementById('idsForm');
  var idsBtnPrint = document.getElementById('idsBtnPrint');

  if (!idsHeroField || !idsDetailsFields || !idsPrintArea || !idsForm || !idsBtnPrint) {
    return;
  }

  // Field schema:
  // - id/label/section define identity and placement
  // - inputType/inputMode/pattern configure editing behavior
  // - required/helpText/validationMessage configure validation and guidance
  // - displayFormat/printClassName customize printed output
  var IDS_FIELDS = [
    {
      id: 'idsProduct',
      label: 'Product / Producto',
      placeholder: 'Select product',
      inputType: 'datalist',
      defaultValue: 'tomatillo',
      // Future enhancement: keep adding product options here or replace this
      // local array with a dynamic catalog source when the product list grows.
      options: [
        { value: 'tomatillo', label: 'tomatillo' },
        { value: 'red bell pepper', label: 'red bell pepper' }
      ],
      required: true,
      section: 'hero',
      printClassName: 'ids-print-card__product-value'
    },
    {
      id: 'idsDate',
      label: 'Date / Fecha',
      placeholder: '',
      inputType: 'date',
      displayFormat: 'mdy',
      helpText: 'Use the date picker to choose the date / Usa el selector de fecha para elegir la fecha.',
      required: true,
      section: 'details'
    },
    {
      id: 'idsSupervisor',
      label: 'Supervisor',
      placeholder: 'Supervisor name',
      inputType: 'text',
      defaultValue: 'FREDDY',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQa',
      label: 'QA',
      placeholder: 'QA name',
      inputType: 'text',
      defaultValue: 'SILVIA',
      required: true,
      section: 'details'
    },
    {
      id: 'idsVendor',
      label: 'Vendor',
      placeholder: 'Vendor name',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsPo',
      label: 'PO',
      placeholder: 'PO number',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsCodeDate',
      label: 'Code Date',
      placeholder: 'Code date',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQty',
      label: 'Qty',
      placeholder: 'Quantity',
      inputType: 'text',
      defaultValue: 'N/A',
      pattern: '^([Nn]\\/[Aa]|[0-9]+(?:\\.[0-9]+)?)$',
      validationMessage: 'Use N/A or enter a quantity such as 12 or 12.5 / Usa N/A o ingresa una cantidad como 12 o 12.5.',
      required: true,
      section: 'details'
    }
  ];

  function createTextNode(tagName, className, text) {
    var node = document.createElement(tagName);
    if (className) {
      node.className = className;
    }
    node.textContent = text;
    return node;
  }

  function formatDisplayValue(field, value) {
    if (!value) {
      return '\u00A0';
    }

    if (field.displayFormat === 'mdy' && field.inputType === 'date') {
      var parts = value.split('-');
      if (parts.length === 3) {
        return parts[1] + '/' + parts[2] + '/' + parts[0];
      }
    }

    return value;
  }

  function renderFormField(field, isHero) {
    var wrapper = document.createElement('div');
    wrapper.className = isHero ? 'ids-title-field' : 'ids-field';

    var label = createTextNode('label', '', field.label);
    label.setAttribute('for', field.id);

    var input;
    if (field.inputType === 'datalist') {
      input = document.createElement('input');
      input.type = 'text';
    } else {
      input = document.createElement('input');
      input.type = field.inputType || 'text';
    }
    input.id = field.id;
    input.name = field.id;

    if (field.placeholder && input.tagName === 'INPUT') {
      input.placeholder = field.placeholder;
    }

    if (field.inputMode) {
      input.inputMode = field.inputMode;
    }

    if (field.pattern) {
      input.pattern = field.pattern;
    }

    if (field.required) {
      input.required = true;
      input.setAttribute('aria-required', 'true');
    }

    if (field.autocomplete) {
      input.autocomplete = field.autocomplete;
    }

    if (field.defaultValue !== undefined) {
      input.value = field.defaultValue;
    }

    if (isHero) {
      input.className = 'ids-title-input';
    }

    if (field.pattern || input.type === 'number') {
      function updateFieldValidity() {
        var hasCustomConstraintError = (
          input.validity.badInput ||
          input.validity.stepMismatch ||
          input.validity.rangeUnderflow ||
          input.validity.rangeOverflow ||
          input.validity.patternMismatch
        );

        if (input.validity.valid) {
          input.setCustomValidity('');
          return;
        }

        if (input.validity.valueMissing) {
          input.setCustomValidity('');
          return;
        }

        input.setCustomValidity(hasCustomConstraintError ? (field.validationMessage || 'Invalid value / Valor inválido.') : '');
      }

      updateFieldValidity();
      input.addEventListener('input', updateFieldValidity);
      input.addEventListener('change', updateFieldValidity);
      input.addEventListener('invalid', updateFieldValidity);
    }

    wrapper.appendChild(label);
    wrapper.appendChild(input);

    if (field.inputType === 'datalist') {
      var dataListId = field.id + 'Options';
      var dataList = document.createElement('datalist');
      dataList.id = dataListId;

      // Future enhancement: expand `options` with dynamic data sources when
      // this field needs to load its choices from configurable catalogs.
      field.options.forEach(function (optionConfig) {
        var option = document.createElement('option');
        option.value = optionConfig.value;
        option.label = optionConfig.label || optionConfig.value;
        option.textContent = optionConfig.label || optionConfig.value;
        dataList.appendChild(option);
      });

      input.setAttribute('list', dataListId);
      wrapper.appendChild(dataList);
    }

    if (field.helpText) {
      var helpText = createTextNode('span', 'ids-help-text', field.helpText);
      var helpTextId = field.id + 'Help';
      helpText.id = helpTextId;
      input.setAttribute('aria-describedby', helpTextId);
      wrapper.appendChild(helpText);
    }

    return {
      wrapper: wrapper,
      input: input
    };
  }

  function renderPrintCard(fields) {
    var printCard = document.createElement('article');
    printCard.className = 'ids-print-card';
    printCard.setAttribute('aria-label', 'IDs print card');

    var topRow = document.createElement('div');
    topRow.className = 'ids-print-card__top';
    topRow.appendChild(createTextNode('div', 'ids-print-card__top-label', 'PRODUCT / PRODUCTO'));
    topRow.appendChild(createTextNode('div', 'ids-print-card__top-wip', 'WIP'));

    var productField = null;
    for (var i = 0; i < fields.length; i += 1) {
      if (fields[i].section === 'hero') {
        productField = fields[i];
        break;
      }
    }

    if (!productField) {
      productField = {
        id: 'idsProductFallback',
        label: 'Product / Producto',
        printClassName: 'ids-print-card__product-value'
      };
    }
    var productBlock = document.createElement('section');
    productBlock.className = 'ids-print-card__product';
    productBlock.appendChild(createTextNode('div', 'ids-print-card__product-label', productField.label));
    var productValue = createTextNode('div', productField.printClassName || 'ids-print-card__product-value', '\u00A0');
    productValue.id = productField.id + 'Display';
    productBlock.appendChild(productValue);

    var detailsGrid = document.createElement('section');
    detailsGrid.className = 'ids-print-card__details';

    var detailFields = fields.filter(function (field) {
      return field.section === 'details';
    });
    var detailColumnCount = 4;
    var detailLastRowStartIndex = Math.floor((detailFields.length - 1) / detailColumnCount) * detailColumnCount;

    detailFields.forEach(function (field, detailIndex) {
      var cell = document.createElement('div');
      cell.className = 'ids-print-card__cell';
      if ((detailIndex + 1) % detailColumnCount === 0) {
        cell.className += ' ids-print-card__cell--last-column';
      }
      if (detailIndex >= detailLastRowStartIndex) {
        cell.className += ' ids-print-card__cell--last-row';
      }
      cell.appendChild(createTextNode('div', 'ids-print-card__cell-label', field.label));
      var cellValue = createTextNode('div', 'ids-print-card__cell-value', '\u00A0');
      cellValue.id = field.id + 'Display';
      cell.appendChild(cellValue);
      detailsGrid.appendChild(cell);
    });

    printCard.appendChild(topRow);
    printCard.appendChild(productBlock);
    printCard.appendChild(detailsGrid);
    idsPrintArea.appendChild(printCard);
  }

  function syncPrintPreview(fields) {
    fields.forEach(function (field) {
      var input = document.getElementById(field.id);
      var display = document.getElementById(field.id + 'Display');
      if (!input || !display) {
        return;
      }

      function updateDisplay() {
        display.textContent = formatDisplayValue(field, input.value);
      }

      updateDisplay();
      input.addEventListener('input', updateDisplay);
      input.addEventListener('change', updateDisplay);
    });
  }

  IDS_FIELDS.forEach(function (field) {
    var formField = renderFormField(field, field.section === 'hero');
    if (field.section === 'hero') {
      idsHeroField.appendChild(formField.wrapper);
      return;
    }

    idsDetailsFields.appendChild(formField.wrapper);
  });

  renderPrintCard(IDS_FIELDS);

  syncPrintPreview(IDS_FIELDS);

  function printIdsCard() {
    if (!idsForm.reportValidity()) {
      return;
    }
    window.print();
  }

  idsForm.addEventListener('submit', function (event) {
    event.preventDefault();
    printIdsCard();
  });
}());
</script>
