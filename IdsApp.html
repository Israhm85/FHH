<script>
(function () {
  var idsHeroField = document.getElementById('idsHeroField');
  var idsDetailsFields = document.getElementById('idsDetailsFields');
  var idsPrintArea = document.getElementById('idsPrintArea');
  var idsForm = document.getElementById('idsForm');
  var idsBtnPrint = document.getElementById('idsBtnPrint');

  if (!idsHeroField || !idsDetailsFields || !idsPrintArea || !idsForm || !idsBtnPrint) {
    return;
  }

  var idsPrintWindowCount = 0;

  // Field schema:
  // - id/label/section define identity and placement
  // - inputType/inputMode/pattern configure editing behavior
  // - required/helpText/validationMessage configure validation and guidance
  // - displayFormat/printClassName customize printed output
  var IDS_FIELDS = [
    {
      id: 'idsProduct',
      label: 'Product / Producto',
      placeholder: 'Enter product name',
      inputType: 'text',
      required: true,
      section: 'hero',
      printClassName: 'ids-print-card__product-value'
    },
    {
      id: 'idsDate',
      label: 'Date / Fecha',
      placeholder: '',
      inputType: 'date',
      displayFormat: 'mdy',
      helpText: 'Use the date picker to choose the date / Usa el selector de fecha para elegir la fecha.',
      required: true,
      section: 'details'
    },
    {
      id: 'idsSupervisor',
      label: 'Supervisor',
      placeholder: 'Supervisor name',
      inputType: 'text',
      defaultValue: 'FREDDY',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQa',
      label: 'QA',
      placeholder: 'QA name',
      inputType: 'text',
      defaultValue: 'SILVIA',
      required: true,
      section: 'details'
    },
    {
      id: 'idsVendor',
      label: 'Vendor',
      inputType: 'datalist',
      defaultValue: 'tomatillo',
      options: [
        { value: 'tomatillo', label: 'tomatillo' },
        { value: 'red bell pepper', label: 'red bell pepper' }
      ],
      required: true,
      section: 'details'
    },
    {
      id: 'idsPo',
      label: 'PO',
      placeholder: 'PO number',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsCodeDate',
      label: 'Code Date',
      placeholder: 'Code date',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQty',
      label: 'Qty',
      placeholder: 'Quantity',
      inputType: 'text',
      defaultValue: 'N/A',
      pattern: '^([Nn]\\/[Aa]|[0-9]+)$',
      validationMessage: 'Use N/A or enter a whole number / Usa N/A o ingresa un número entero.',
      required: true,
      section: 'details'
    }
  ];

  function createTextNode(tagName, className, text) {
    var node = document.createElement(tagName);
    if (className) {
      node.className = className;
    }
    node.textContent = text;
    return node;
  }

  function formatDisplayValue(field, value) {
    if (!value) {
      return '\u00A0';
    }

    if (field.displayFormat === 'mdy' && field.inputType === 'date') {
      var parts = value.split('-');
      if (parts.length === 3) {
        return parts[1] + '/' + parts[2] + '/' + parts[0];
      }
    }

    return value;
  }

  function renderFormField(field, isHero) {
    var wrapper = document.createElement('div');
    wrapper.className = isHero ? 'ids-title-field' : 'ids-field';

    var label = createTextNode('label', '', field.label);
    label.setAttribute('for', field.id);

    var input;
    if (field.inputType === 'datalist') {
      input = document.createElement('input');
      input.type = 'text';
    } else {
      input = document.createElement('input');
      input.type = field.inputType || 'text';
    }
    input.id = field.id;
    input.name = field.id;

    if (field.placeholder && input.tagName === 'INPUT') {
      input.placeholder = field.placeholder;
    }

    if (field.inputMode) {
      input.inputMode = field.inputMode;
    }

    if (field.pattern) {
      input.pattern = field.pattern;
    }

    if (field.required) {
      input.required = true;
      input.setAttribute('aria-required', 'true');
    }

    if (field.autocomplete) {
      input.autocomplete = field.autocomplete;
    }

    if (field.defaultValue !== undefined) {
      input.value = field.defaultValue;
    }

    if (isHero) {
      input.className = 'ids-title-input';
    }

    if (field.pattern || input.type === 'number') {
      function updateFieldValidity() {
        var hasCustomConstraintError = (
          input.validity.badInput ||
          input.validity.stepMismatch ||
          input.validity.rangeUnderflow ||
          input.validity.rangeOverflow ||
          input.validity.patternMismatch
        );

        if (input.validity.valid) {
          input.setCustomValidity('');
          return;
        }

        if (input.validity.valueMissing) {
          input.setCustomValidity('');
          return;
        }

        input.setCustomValidity(hasCustomConstraintError ? (field.validationMessage || 'Invalid value / Valor inválido.') : '');
      }

      updateFieldValidity();
      input.addEventListener('input', updateFieldValidity);
      input.addEventListener('change', updateFieldValidity);
      input.addEventListener('invalid', updateFieldValidity);
    }

    wrapper.appendChild(label);
    wrapper.appendChild(input);

    if (field.inputType === 'datalist') {
      var dataListId = field.id + 'Options';
      var dataList = document.createElement('datalist');
      dataList.id = dataListId;

      // Future enhancement: expand `options` with dynamic data sources when
      // this field needs to load its choices from configurable catalogs.
      field.options.forEach(function (optionConfig) {
        var option = document.createElement('option');
        option.value = optionConfig.value;
        dataList.appendChild(option);
      });

      input.setAttribute('list', dataListId);
      wrapper.appendChild(dataList);
    }

    if (field.helpText) {
      var helpText = createTextNode('span', 'ids-help-text', field.helpText);
      var helpTextId = field.id + 'Help';
      helpText.id = helpTextId;
      input.setAttribute('aria-describedby', helpTextId);
      wrapper.appendChild(helpText);
    }

    return {
      wrapper: wrapper,
      input: input
    };
  }

  function renderPrintCard(fields) {
    var printCard = document.createElement('article');
    printCard.className = 'ids-print-card';
    printCard.setAttribute('aria-label', 'IDs print card');

    var topRow = document.createElement('div');
    topRow.className = 'ids-print-card__top';
    topRow.appendChild(createTextNode('div', 'ids-print-card__top-label', 'PRODUCT / PRODUCTO'));
    topRow.appendChild(createTextNode('div', 'ids-print-card__top-wip', 'WIP'));

    var productField = null;
    for (var i = 0; i < fields.length; i += 1) {
      if (fields[i].section === 'hero') {
        productField = fields[i];
        break;
      }
    }

    if (!productField) {
      productField = {
        id: 'idsProductFallback',
        label: 'Product / Producto',
        printClassName: 'ids-print-card__product-value'
      };
    }
    var productBlock = document.createElement('section');
    productBlock.className = 'ids-print-card__product';
    productBlock.appendChild(createTextNode('div', 'ids-print-card__product-label', productField.label));
    var productValue = createTextNode('div', productField.printClassName || 'ids-print-card__product-value', '\u00A0');
    productValue.id = productField.id + 'Display';
    productBlock.appendChild(productValue);

    var detailsGrid = document.createElement('section');
    detailsGrid.className = 'ids-print-card__details';

    var detailFields = fields.filter(function (field) {
      return field.section === 'details';
    });
    var detailColumnCount = 4;
    var detailLastRowStartIndex = Math.floor((detailFields.length - 1) / detailColumnCount) * detailColumnCount;

    detailFields.forEach(function (field, detailIndex) {
      var cell = document.createElement('div');
      cell.className = 'ids-print-card__cell';
      if ((detailIndex + 1) % detailColumnCount === 0 || detailIndex === detailFields.length - 1) {
        cell.className += ' ids-print-card__cell--last-column';
      }
      if (detailIndex >= detailLastRowStartIndex) {
        cell.className += ' ids-print-card__cell--last-row';
      }
      cell.appendChild(createTextNode('div', 'ids-print-card__cell-label', field.label));
      var cellValue = createTextNode('div', 'ids-print-card__cell-value', '\u00A0');
      cellValue.id = field.id + 'Display';
      cell.appendChild(cellValue);
      detailsGrid.appendChild(cell);
    });

    printCard.appendChild(topRow);
    printCard.appendChild(productBlock);
    printCard.appendChild(detailsGrid);
    idsPrintArea.appendChild(printCard);
  }

  function syncPrintPreview(fields) {
    fields.forEach(function (field) {
      var input = document.getElementById(field.id);
      var display = document.getElementById(field.id + 'Display');
      if (!input || !display) {
        return;
      }

      function updateDisplay() {
        display.textContent = formatDisplayValue(field, input.value);
      }

      updateDisplay();
      input.addEventListener('input', updateDisplay);
      input.addEventListener('change', updateDisplay);
    });
  }

  function getPrintStyles() {
    return [
      '@page { size: landscape; margin: 6mm; }',
      'html, body { margin: 0; padding: 0; background: #fff; color: #1d1d1d; font-family: Arial, Helvetica, sans-serif; }',
      'body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
      '.ids-print-sheet { width: 100%; }',
      '.ids-print-card { width: 100%; background: #fff; border: 3px solid #1d1d1d; color: #1d1d1d; box-sizing: border-box; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }',
      '.ids-print-card__top { display: grid; grid-template-columns: 1fr 190px; border-bottom: 3px solid #1d1d1d; }',
      '.ids-print-card__top-label, .ids-print-card__top-wip { padding: 14px 18px; font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }',
      '.ids-print-card__top-wip { text-align: center; border-left: 3px solid #1d1d1d; }',
      '.ids-print-card__product { min-height: 200px; padding: 24px 22px 20px; border-bottom: 3px solid #1d1d1d; }',
      '.ids-print-card__product-label, .ids-print-card__cell-label { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }',
      '.ids-print-card__product-label { width: 100%; margin-bottom: 8px; text-align: left; }',
      '.ids-print-card__product-value { min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 72px; font-weight: 900; line-height: .95; text-transform: uppercase; }',
      '.ids-print-card__details { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: #fff; }',
      '.ids-print-card__cell { min-height: 84px; padding: 12px 14px 10px; background: #fff; border-right: 3px solid #1d1d1d; border-bottom: 3px solid #1d1d1d; }',
      '.ids-print-card__cell--last-column { border-right: 0; }',
      '.ids-print-card__cell--last-row { border-bottom: 0; }',
      '.ids-print-card__cell-label { margin-bottom: 8px; }',
      '.ids-print-card__cell-value { min-height: 26px; font-size: 24px; font-weight: 700; line-height: 1.1; word-break: break-word; }',
    ].join('');
  }

  IDS_FIELDS.forEach(function (field) {
    var formField = renderFormField(field, field.section === 'hero');
    if (field.section === 'hero') {
      idsHeroField.appendChild(formField.wrapper);
      return;
    }

    idsDetailsFields.appendChild(formField.wrapper);
  });

  renderPrintCard(IDS_FIELDS);

  syncPrintPreview(IDS_FIELDS);

  function printIdsCard() {
    if (!idsForm.reportValidity()) {
      return;
    }

    idsPrintWindowCount += 1;

    var printWindow = window.open('', 'ids-print-window-' + idsPrintWindowCount, 'width=1400,height=900');
    var hasFinalizedPrintWindow = false;
    if (!printWindow) {
      return;
    }

    var printDocument = printWindow.document;

    var sourceCard = idsPrintArea.querySelector('.ids-print-card');
    if (!sourceCard) {
      printWindow.close();
      return;
    }

    function handlePrintDocumentReadyStateChange() {
      if (printWindow.closed || printDocument.readyState !== 'complete') {
        return;
      }

      finalizePrintWindow();
    }

    printDocument.addEventListener('readystatechange', handlePrintDocumentReadyStateChange);
    printWindow.addEventListener('load', finalizePrintWindow, { once: true });
    printDocument.open();
    printDocument.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IDs Print</title></head><body><main class="ids-print-sheet"></main></body></html>');
    printDocument.close();

    function finalizePrintWindow() {
      if (hasFinalizedPrintWindow) {
        return;
      }

      hasFinalizedPrintWindow = true;
      printDocument.removeEventListener('readystatechange', handlePrintDocumentReadyStateChange);
      printWindow.removeEventListener('load', finalizePrintWindow);

      if (printWindow.closed || !printDocument) {
        return;
      }

      var hasPrinted = false;
      var cleanupTimerId = null;

      function closePrintWindow() {
        window.removeEventListener('focus', handleFocusReturn);

        if (cleanupTimerId !== null && !printWindow.closed) {
          printWindow.clearTimeout(cleanupTimerId);
          cleanupTimerId = null;
        }

        if (!printWindow.closed) {
          printWindow.close();
        }
      }

      function handleFocusReturn() {
        if (!hasPrinted) {
          return;
        }

        window.setTimeout(closePrintWindow, 300);
      }

      printDocument.head.appendChild((function () {
        var style = printDocument.createElement('style');
        style.textContent = getPrintStyles();
        return style;
      }()));
      printDocument.querySelector('.ids-print-sheet').appendChild(sourceCard.cloneNode(true));
      printWindow.onafterprint = closePrintWindow;
      printWindow.setTimeout(function () {
        if (printWindow.closed) {
          return;
        }

        hasPrinted = true;
        window.addEventListener('focus', handleFocusReturn);
        printWindow.focus();
        printWindow.print();
        cleanupTimerId = printWindow.setTimeout(closePrintWindow, 60000);
      }, 150);
    }

    if (printDocument.readyState === 'complete') {
      finalizePrintWindow();
      return;
    }
  }

  idsForm.addEventListener('submit', function (event) {
    event.preventDefault();
    printIdsCard();
  });
}());
</script>
