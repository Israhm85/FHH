<script>
(function () {
  var idsHeroField = document.getElementById('idsHeroField');
  var idsDetailsFields = document.getElementById('idsDetailsFields');

  if (!idsHeroField || !idsDetailsFields) {
    return;
  }

  // Future enhancement: add an `options` array (or remote source metadata) to any
  // field definition below and branch in renderField() to replace the text input
  // with a <select> or another option-driven control when those catalogs are ready.
  var IDS_FIELDS = [
    {
      id: 'idsProduct',
      label: 'Product / Producto',
      placeholder: 'Enter product name',
      inputType: 'text',
      required: true,
      section: 'hero'
    },
    {
      id: 'idsDate',
      label: 'Date / Fecha',
      placeholder: '',
      inputType: 'date',
      helpText: 'Use the date picker to choose the date.',
      required: true,
      section: 'details'
    },
    {
      id: 'idsSupervisor',
      label: 'Supervisor',
      placeholder: 'Supervisor name',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQa',
      label: 'QA',
      placeholder: 'QA name',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsVendor',
      label: 'Vendor',
      placeholder: 'Vendor',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsPo',
      label: 'PO',
      placeholder: 'PO number',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsCodeDate',
      label: 'Code Date',
      placeholder: 'Code date',
      inputType: 'text',
      required: true,
      section: 'details'
    },
    {
      id: 'idsQty',
      label: 'Qty',
      placeholder: 'Quantity',
      inputType: 'text',
      inputMode: 'numeric',
      pattern: '^[0-9]+$',
      validationMessage: 'Enter a whole number.',
      required: true,
      section: 'details'
    }
  ];

  function renderField(field, isHero) {
    var wrapper = document.createElement('div');
    wrapper.className = isHero ? 'ids-title-field' : 'ids-field';

    var label = document.createElement('label');
    label.setAttribute('for', field.id);
    label.textContent = field.label;

    var input = document.createElement('input');
    input.type = field.inputType || 'text';
    input.id = field.id;
    input.name = field.id;
    input.autocomplete = 'off';

    if (field.placeholder) {
      input.placeholder = field.placeholder;
    }

    if (field.inputMode) {
      input.inputMode = field.inputMode;
    }

    if (field.pattern) {
      input.pattern = field.pattern;
    }

    if (field.required) {
      input.required = true;
      input.setAttribute('aria-required', 'true');
    }

    if (field.pattern) {
      var patternRegex = new RegExp(field.pattern);

      function updatePatternValidity() {
        var isValid = input.value === '' || patternRegex.test(input.value);
        input.setCustomValidity(isValid ? '' : (field.validationMessage || 'Invalid value.'));
      }

      updatePatternValidity();
      input.addEventListener('input', updatePatternValidity);
      input.addEventListener('change', updatePatternValidity);
      input.addEventListener('invalid', updatePatternValidity);
    }

    if (isHero) {
      input.className = 'ids-title-input';
    }

    wrapper.appendChild(label);
    wrapper.appendChild(input);

    if (field.helpText) {
      var helpText = document.createElement('span');
      var helpTextId = field.id + 'Help';
      helpText.className = 'ids-help-text';
      helpText.id = helpTextId;
      helpText.textContent = field.helpText;
      input.setAttribute('aria-describedby', helpTextId);
      wrapper.appendChild(helpText);
    }

    return wrapper;
  }

  IDS_FIELDS.forEach(function (field) {
    var isHero = field.section === 'hero';
    var fieldNode = renderField(field, isHero);
    if (isHero) {
      idsHeroField.appendChild(fieldNode);
      return;
    }

    idsDetailsFields.appendChild(fieldNode);
  });
}());
</script>
